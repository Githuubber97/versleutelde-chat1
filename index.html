<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>💬 Versleutelde Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e5ddd5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
    }

    #overlay input, #overlay button {
      width: 280px;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    header {
      background: #075e54;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    #online-users {
      background: #f0f0f0;
      padding: 8px;
      font-size: 14px;
      color: #444;
      text-align: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 12px;
      position: relative;
      word-wrap: break-word;
    }

    .me {
      align-self: flex-end;
      background: #dcf8c6;
      border-bottom-right-radius: 0;
    }

    .them {
      align-self: flex-start;
      background: white;
      border-bottom-left-radius: 0;
    }

    footer {
      background: #fff;
      padding: 10px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ccc;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    button {
      background: #128c7e;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0e7667;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>Voer je naam en sleutel in</h2>
    <input type="text" id="overlayName" placeholder="👤 Je naam">
    <input type="password" id="overlayKey" placeholder="🔑 Je geheime sleutel">
    <button onclick="startChat()">Start chat</button>
  </div>

  <header>🔐 Versleutelde Chat</header>
  <div id="online-users"></div>

  <div id="messages"></div>

  <footer>
    <textarea id="message" rows="1" placeholder="Typ een bericht..."></textarea>
    <button onclick="sendMessage()">📤</button>
  </footer>

  <script>
    let username = "";
    let encryptionKey = "";
    const socket = new WebSocket(`wss://${location.host}`);
    const messagesDiv = document.getElementById("messages");

    function startChat() {
      const nameInput = document.getElementById("overlayName").value.trim();
      const keyInput = document.getElementById("overlayKey").value.trim();
      if (!nameInput || !keyInput) {
        alert("Vul zowel je naam als sleutel in!");
        return;
      }
      username = nameInput;
      encryptionKey = keyInput;
      document.getElementById("overlay").style.display = "none";

      socket.send(JSON.stringify({
        type: "register",
        name: username
      }));
    }

    socket.onmessage = event => {
      const data = JSON.parse(event.data);

      if (data.type === "users") {
        document.getElementById("online-users").innerHTML =
          "🟢 Online: " + data.users.join(", ");
        return;
      }

      if (data.type === "message") {
        const msgBox = document.createElement("div");
        msgBox.classList.add("message");

        msgBox.classList.add(data.name === username ? "me" : "them");

        try {
          const decrypted = CryptoJS.AES.decrypt(data.encrypted, encryptionKey).toString(CryptoJS.enc.Utf8);
          msgBox.textContent = decrypted || "[❌ Sleutel klopt niet]";
        } catch {
          msgBox.textContent = "[⚠️ Fout bij decryptie]";
        }

        messagesDiv.appendChild(msgBox);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    };

    function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      if (!username || !encryptionKey || !msg) {
        alert("Chat is nog niet gestart of bericht is leeg.");
        return;
      }

      const encrypted = CryptoJS.AES.encrypt(msg, encryptionKey).toString();
      const payload = { type: "message", name: username, encrypted: encrypted };
      socket.send(JSON.stringify(payload));
      document.getElementById("message").value = "";
    }
  </script>

</body>
</html>
