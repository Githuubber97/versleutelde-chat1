<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>🔐 Veilige Chat met AES-GCM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }
    #messages {
      background: #fff;
      padding: 12px;
      height: 300px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
    }
    .message {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .sender {
      font-weight: bold;
      color: #333;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #overlay input, #overlay button {
      width: 300px;
      margin: 10px;
    }
    #online-users {
      margin-top: 10px;
      font-weight: bold;
      color: #444;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>Voer je naam en sleutel in</h2>
    <input type="text" id="overlayName" placeholder="👤 Je naam">
    <input type="password" id="overlayKey" placeholder="🔑 Je geheime sleutel">
    <button onclick="startChat()">Start chat</button>
  </div>

  <h1>🔐 Veilige Chat met AES-GCM</h1>

  <div id="online-users"></div>

  <textarea id="message" rows="2" placeholder="💬 Typ je bericht..."></textarea>
  <button onclick="sendMessage()">Verzend bericht</button>

  <div id="messages"></div>

  <script>
    let username = "";
    let rawKey = "";
    let aesKey;
    const socket = new WebSocket(`wss://${location.host}`);
    const messagesDiv = document.getElementById("messages");

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("fixedSalt123"), // gebruik in productie een random salt!
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptMessage(text) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        enc.encode(text)
      );
      return {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(ciphertext))
      };
    }

    async function decryptMessage(iv, data) {
      const dec = new TextDecoder();
      try {
        const plaintext = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(iv) },
          aesKey,
          new Uint8Array(data)
        );
        return dec.decode(plaintext);
      } catch (e) {
        return "[❌ Kon niet ontsleutelen]";
      }
    }

    async function startChat() {
      const nameInput = document.getElementById("overlayName").value.trim();
      const keyInput = document.getElementById("overlayKey").value.trim();
      if (!nameInput || !keyInput) {
        alert("Vul zowel je naam als sleutel in!");
        return;
      }
      username = nameInput;
      rawKey = keyInput;
      aesKey = await deriveKey(rawKey);
      document.getElementById("overlay").style.display = "none";

      socket.send(JSON.stringify({
        type: "register",
        name: username
      }));
    }

    socket.onmessage = async event => {
      const data = JSON.parse(event.data);

      if (data.type === "users") {
        document.getElementById("online-users").innerHTML =
          "🟢 Online: " + data.users.join(", ");
        return;
      }

      if (data.type === "message") {
        const msgBox = document.createElement("div");
        msgBox.classList.add("message");

        const name = document.createElement("div");
        name.classList.add("sender");
        name.textContent = data.name + " zegt:";

        const content = document.createElement("div");
        const decrypted = await decryptMessage(data.iv, data.encrypted);
        content.textContent = decrypted;

        msgBox.appendChild(name);
        msgBox.appendChild(content);
        messagesDiv.appendChild(msgBox);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    };

    async function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      if (!username || !aesKey || !msg) {
        alert("Chat is nog niet gestart of bericht is leeg.");
        return;
      }

      const encrypted = await encryptMessage(msg);
      const payload = {
        type: "message",
        name: username,
        iv: encrypted.iv,
        encrypted: encrypted.data
      };
      socket.send(JSON.stringify(payload));
      document.getElementById("message").value = "";
    }
  </script>

</body>
</html>
