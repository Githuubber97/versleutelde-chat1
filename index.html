
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>🔐 Persoonlijke Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e5ddd5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 20px;
    }
    #overlay input, #overlay button {
      width: 260px;
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    header {
      background: #075e54;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 20px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 70%;
      padding: 10px;
      margin: 5px;
      border-radius: 12px;
      position: relative;
      word-wrap: break-word;
    }
    .me { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 0; }
    .them { align-self: flex-start; background: #fff; border-bottom-left-radius: 0; }
    footer {
      background: #fff;
      padding: 10px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #ccc;
    }
    textarea {
      resize: none;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    select, button {
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>Je naam + je geheime sleutel</h2>
    <input type="text" id="overlayName" placeholder="👤 Gebruikersnaam">
    <input type="password" id="overlayKey" placeholder="🔑 Eigen sleutel">
    <button onclick="startChat()">Start chat</button>
  </div>

  <header>🔐 Gerichte Chat</header>
  <div id="messages"></div>

  <footer>
    <label for="userSelect">Stuur naar:</label>
    <select id="userSelect"></select>
    <textarea id="message" rows="2" placeholder="Typ je bericht..."></textarea>
    <button onclick="sendMessage()">📤 Verstuur</button>
  </footer>

  <script>
    let username = "";
    let myKey = "";
    const socket = new WebSocket(`wss://${location.host}`);
    const messagesDiv = document.getElementById("messages");
    const userSelect = document.getElementById("userSelect");

    function startChat() {
      username = document.getElementById("overlayName").value.trim();
      myKey = document.getElementById("overlayKey").value.trim();
      if (!username || !myKey) {
        alert("Vul alles in");
        return;
      }
      document.getElementById("overlay").style.display = "none";
      socket.send(JSON.stringify({ type: "register", name: username }));
    }

    socket.onmessage = event => {
      const data = JSON.parse(event.data);

      if (data.type === "users") {
        userSelect.innerHTML = "";
        data.users.forEach(user => {
          if (user !== username) {
            const opt = document.createElement("option");
            opt.value = user;
            opt.textContent = user;
            userSelect.appendChild(opt);
          }
        });
        return;
      }

      if (data.type === "message") {
        const msgBox = document.createElement("div");
        msgBox.classList.add("message", "them");

        const decrypted = CryptoJS.AES.decrypt(data.encrypted, myKey).toString(CryptoJS.enc.Utf8);
        msgBox.textContent = `${data.from}: ` + (decrypted || "[❌ Sleutel klopt niet]");
        messagesDiv.appendChild(msgBox);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    };

    function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      const to = userSelect.value;
      if (!msg || !to) return;

      const encrypted = CryptoJS.AES.encrypt(msg, prompt("Sleutel van " + to)).toString();
      socket.send(JSON.stringify({ type: "message", to: to, encrypted: encrypted }));
      const msgBox = document.createElement("div");
      msgBox.classList.add("message", "me");
      msgBox.textContent = `Aan ${to}: ${msg}`;
      messagesDiv.appendChild(msgBox);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      document.getElementById("message").value = "";
    }
  </script>

</body>
</html>
