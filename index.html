<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>🔐 Versleutelde Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
    }
    #messages {
      background: #fff;
      padding: 12px;
      height: 300px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
    }
    .message {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .sender {
      font-weight: bold;
      color: #333;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #overlay input, #overlay button {
      width: 300px;
      margin: 10px;
    }
    #online-users {
      margin-top: 10px;
      font-weight: bold;
      color: #444;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>Voer je naam en sleutel in</h2>
    <input type="text" id="overlayName" placeholder="👤 Je naam">
    <input type="password" id="overlayKey" placeholder="🔑 Je geheime sleutel">
    <button onclick="startChat()">Start chat</button>
  </div>

  <h1>🔐 Realtime Chat met AES</h1>

  <div id="online-users"></div>

  <textarea id="message" rows="2" placeholder="💬 Typ je bericht..."></textarea>
  <button onclick="sendMessage()">Verzend bericht</button>

  <div id="messages"></div>

  <script>
    let username = "";
    let encryptionKey = "";
    const socket = new WebSocket(`wss://${location.host}`);
    const messagesDiv = document.getElementById("messages");

    function startChat() {
      const nameInput = document.getElementById("overlayName").value.trim();
      const keyInput = document.getElementById("overlayKey").value.trim();
      if (!nameInput || !keyInput) {
        alert("Vul zowel je naam als sleutel in!");
        return;
      }
      username = nameInput;
      encryptionKey = keyInput;
      document.getElementById("overlay").style.display = "none";

      socket.send(JSON.stringify({
        type: "register",
        name: username
      }));
    }

    socket.onmessage = event => {
      const data = JSON.parse(event.data);

      if (data.type === "users") {
        document.getElementById("online-users").innerHTML =
          "🟢 Online: " + data.users.join(", ");
        return;
      }

      if (data.type === "message") {
        const msgBox = document.createElement("div");
        msgBox.classList.add("message");

        const name = document.createElement("div");
        name.classList.add("sender");
        name.textContent = data.name + " zegt:";

        const content = document.createElement("div");
        content.textContent = data.encrypted;

        const decryptInput = document.createElement("input");
        decryptInput.type = "password";
        decryptInput.placeholder = "🔑 Voer sleutel in";

        const decryptButton = document.createElement("button");
        decryptButton.textContent = "🔓 Ontsleutelen";
        decryptButton.onclick = () => {
          const pass = decryptInput.value;
          try {
            const decrypted = CryptoJS.AES.decrypt(data.encrypted, pass).toString(CryptoJS.enc.Utf8);
            content.textContent = decrypted || "[❌ Sleutel klopt niet]";
          } catch {
            content.textContent = "[⚠️ Fout bij decryptie]";
          }
        };

        msgBox.appendChild(name);
        msgBox.appendChild(content);
        msgBox.appendChild(decryptInput);
        msgBox.appendChild(decryptButton);
        messagesDiv.appendChild(msgBox);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    };

    function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      if (!username || !encryptionKey || !msg) {
        alert("Chat is nog niet gestart of bericht is leeg.");
        return;
      }

      const encrypted = CryptoJS.AES.encrypt(msg, encryptionKey).toString();
      const payload = { type: "message", name: username, encrypted: encrypted };
      socket.send(JSON.stringify(payload));
      document.getElementById("message").value = "";
    }
  </script>

</body>
</html>
